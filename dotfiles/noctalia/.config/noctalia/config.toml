[shell]
clipboard_enabled = true
clipboard_keep_from_closed_apps = true
clipboard_history_max_entries = 100
clipboard_auto_paste = "auto"

[shell.animation]
enabled = false

[lockscreen]
enabled = true

[idle.behavior.lock]
enabled = true
timeout = 300
action = "lock"

[idle.behavior.screen-off]
enabled = true
timeout = 330
action = "screen_off"
