[audio]
enable_sounds = true

[bar.default]
background_opacity = 0.62999998591840267
center = [ "clock", "date" ]
end = [
    "media",
    "tray",
    "notifications",
    "clipboard",
    "network",
    "bluetooth",
    "volume",
    "brightness",
    "battery",
    "control-center"
]
margin_ends = 0
radius = 0
scale = 1.1000000089406967
shadow = false
start = [ "workspaces" ]
thickness = 27
widget_spacing = 10

[calendar]

[control_center]
hidden_tabs = [ "screen-time" ]

    [control_center.calendar]
    show_week_numbers = true

[desktop_widgets]
enabled = false

[idle.behavior.lock]
action = "lock"
enabled = true
timeout = 300

[idle.behavior.screen-off]
action = "screen_off"
enabled = true
timeout = 330

[location]
auto_locate = true

[lockscreen]
blur_intensity = 0.59999998658895493
enabled = true
fingerprint = false

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [ "lockscreen-login-box@HDMI-A-1", "lockscreen-login-box@DP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-1"]
    box_height = 82.0
    box_width = 736.0
    cx = 1720.0
    cy = 679.0
    output = "DP-1"
    placement_height = 1440.0
    placement_width = 3440.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = false
        show_login_button = false
        show_media = false
        show_session_buttons = false
        show_unlock_hint = false
        show_weather = false

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 540.0
    cy = 1738.0
    output = "HDMI-A-1"
    placement_height = 1920.0
    placement_width = 1080.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[nightlight]
enabled = true

[shell]
font_family = "JetBrainsMono Nerd Font"
polkit_agent = true

    [shell.animation]
    enabled = false

    [shell.launcher.providers.calculator]
    global = false

    [[shell.session.actions]]
    action = "lock"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "1"
    variant = "default"

    [[shell.session.actions]]
    action = "logout"
    countdown_seconds = 0.0
    enabled = false
    shortcut = "2"
    variant = "default"

    [[shell.session.actions]]
    action = "lock_and_suspend"
    countdown_seconds = 0.0
    enabled = false
    shortcut = "3"
    variant = "default"

    [[shell.session.actions]]
    action = "reboot"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "4"
    variant = "default"

    [[shell.session.actions]]
    action = "shutdown"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "5"
    variant = "destructive"

[theme]
community_palette = "Tokyo Night Storm"
source = "community"

[wallpaper]
directory = "/home/manoloess/Downloads"

    [wallpaper.default]
    path = "/home/manoloess/Downloads/shaded.png"

    [wallpaper.last]
    path = "/home/manoloess/Downloads/shaded.png"

    [wallpaper.monitors.DP-1]
    path = "/home/manoloess/Downloads/shaded.png"

    [wallpaper.monitors.HDMI-A-1]
    path = "/home/manoloess/Downloads/shaded.png"

[widget.control-center]
glyph = "navigation-filled"

[widget.launcher]
glyph = "brackets-angle-off"

[widget.media]
hide_album_art = true
hide_when_no_media = true
show_progress = true
title_scroll = "always"

[widget.network]
show_label = false

[widget.workspaces]
focused_output_only = true
hide_when_empty = true
labels_only_when_occupied = true
